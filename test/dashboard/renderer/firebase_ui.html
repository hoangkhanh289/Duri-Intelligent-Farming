  soil_temperature:{ label: "Nhiệt độ đất",       unit: "°C", color: "#8A5A2B", accent:"soil", range:[16,30] },
  soil_humidity:   { label: "Độ ẩm đất",          unit: "%",  color: "#B9772E", accent:"soil", range:[35,85] },
  water_storage:   { label: "Mực nước",           unit: "lvl",color: "#2E7350", accent:"green",range:[2,10] },

function api(){ return window.electronAPI || window.parent?.electronAPI || null; }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

function fmtNum(v, digits){
  if (v === undefined || v === null || Number.isNaN(v)) return "—";
  if (typeof v !== "number") return v;
  return digits === undefined ? (Math.round(v*10)/10) : v.toFixed(digits);
}

function formatTime(ms){
  if (typeof ms !== "number") return "—";
  return new Date(ms).toLocaleString("vi-VN", { hour12: false });
}

function timeAgo(ms){
  if (typeof ms !== "number") return "—";
  const diff = Date.now() - ms;
  if (diff < 60000) return "vừa xong";
  if (diff < 3600000) return Math.floor(diff/60000) + " phút trước";
  if (diff < 86400000) return Math.floor(diff/3600000) + " giờ trước";
  return Math.floor(diff/86400000) + " ngày trước";
}

function isOnline(node){
  return typeof node.time === "number" && (Date.now() - node.time) < 10*60*1000;
}

/* ============================================================
   CANVAS DRAWING HELPERS (no external chart lib — real session data only)
   ============================================================ */
function sizeCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(rect.width, 40), h = Math.max(rect.height, 20);
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx, w, h };
}

function drawSparkline(canvas, points, color){
  if (!canvas) return;
  const { ctx, w, h } = sizeCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  if (!points || points.length < 2) {
    ctx.strokeStyle = "#D2CDB8"; ctx.lineWidth = 1; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(0,h-3); ctx.lineTo(w,h-3); ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  const vals = points.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = (i/(points.length-1)) * w;
    const y = h - ((p.v - min)/span) * (h-4) - 2;
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.lineJoin="round"; ctx.stroke();
  const last = points[points.length-1];
  const lx = w, ly = h - ((last.v-min)/span)*(h-4) - 2;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(lx-1.5, ly, 2, 0, 7); ctx.fill();
}

function drawLineChart(canvas, series, color, unit){
  if (!canvas) return;
  const { ctx, w, h } = sizeCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL = 34, padB = 18, padT = 10, padR = 8;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  ctx.strokeStyle = "#EFEEE4"; ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const y = padT + (plotH/3)*i;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
  }
  if (!series || series.length < 2){
    ctx.fillStyle = "#8B958C"; ctx.font = "11px IBM Plex Mono, monospace";
    ctx.fillText("Đang thu thập dữ liệu phiên realtime…", padL, h/2);
    return;
  }
  const vals = series.map(p=>p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  ctx.fillStyle = "#8B958C"; ctx.font = "10px IBM Plex Mono, monospace"; ctx.textAlign="right";
  ctx.fillText(fmtNum(max)+" "+(unit||""), padL-6, padT+9);
  ctx.fillText(fmtNum(min)+" "+(unit||""), padL-6, h-padB);
  ctx.textAlign="left";

  const grad = ctx.createLinearGradient(0,padT,0,h-padB);
  grad.addColorStop(0, color+"33"); grad.addColorStop(1, color+"02");
  ctx.beginPath();
  series.forEach((p,i)=>{
    const x = padL + (i/(series.length-1))*plotW;
    const y = padT + (1-((p.v-min)/span))*plotH;
    i===0? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.lineTo(padL+plotW, h-padB); ctx.lineTo(padL, h-padB); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  series.forEach((p,i)=>{
    const x = padL + (i/(series.length-1))*plotW;
    const y = padT + (1-((p.v-min)/span))*plotH;
    i===0? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.lineJoin="round"; ctx.stroke();
}

function drawRing(svgEl, percent, color, trackColor){
  const r = 15.9155;
  const c = 2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, percent));
  svgEl.innerHTML = `
    <svg viewBox="0 0 36 36" width="100%" height="100%">
      <circle cx="18" cy="18" r="${r}" fill="none" stroke="${trackColor}" stroke-width="3.2"/>
      <circle cx="18" cy="18" r="${r}" fill="none" stroke="${color}" stroke-width="3.2"
        stroke-dasharray="${(pct/100)*c} ${c}" stroke-linecap="round"
        transform="rotate(-90 18 18)"/>
      <text x="18" y="20.5" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="9.5" fill="${color}">${Math.round(pct)}%</text>
    </svg>`;
}

/* ============================================================
   HEURISTIC HEALTH SCORE (transparent, derived from optimal bands)
   ============================================================ */
function scoreInRange(v, [lo,hi]){
  if (typeof v !== "number") return null;
  if (v >= lo && v <= hi) return 100;
  const span = hi-lo;
  const dist = v < lo ? (lo-v) : (v-hi);
  return Math.max(0, Math.round(100 - (dist/span)*140));
}
function nodeHealthScore(node){
  const scores = [];
  ["air_temperature","air_humidity","soil_temperature","soil_humidity"].forEach(k=>{
    const s = scoreInRange(node[k], FIELD_META[k].range);
    if (s !== null) scores.push(s);
  });
  if (!isOnline(node)) return 0;
  if (!scores.length) return null;
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}

/* ============================================================
   KPI STRIP
   ============================================================ */
function renderKPIs(gardens){
  const ids = Object.keys(gardens);
  let totalNodes=0, online=0, offline=0, crit=0, warn=0, ok=0, mlHits=0, rainSum=0, rainCount=0, waterSum=0, waterCount=0;

  ids.forEach(gid=>{
    const { data, analysis } = gardens[gid];
    for(let i=1;i<=5;i++){
      const n = data[`node${i}`];
      if(!n) continue;
      totalNodes++;
      isOnline(n) ? online++ : offline++;
    }
    (analysis.matched||[]).forEach(m=>{
      if (m.severity === "Critical") crit++;
      else if (m.severity === "Warning") warn++;
      else ok++;
    });
    (analysis.model_predictions||[]).forEach(p=>{ if(!p.error && !p.skipped) mlHits++; });
    const w = analysis.weather || {};
    if (typeof w.rain_probability === "number"){ rainSum += w.rain_probability; rainCount++; }
    const avg = analysis.node_averages || {};
    if (typeof avg.water_storage === "number"){ waterSum += avg.water_storage; waterCount++; }
  });

  const kpis = [
    { icon:"node", accent:"var(--green-600)", tint:"var(--green-tint)", label:"Tổng số vườn", value: ids.length },
    { icon:"node", accent:"var(--blue-600)", tint:"var(--blue-tint)", label:"Tổng số node", value: totalNodes },
    { icon:"check", accent:"var(--success)", tint:"var(--success-tint)", label:"Node online", value: online },
    { icon:"alert", accent:"var(--danger)", tint:"var(--danger-tint)", label:"Node offline", value: offline },
    { icon:"alert", accent:"var(--danger)", tint:"var(--danger-tint)", label:"Cảnh báo Critical", value: crit },
    { icon:"alert", accent:"var(--warn)", tint:"var(--warn-tint)", label:"Cảnh báo Warning", value: warn },
    { icon:"check", accent:"var(--success)", tint:"var(--success-tint)", label:"Bình thường", value: ok },
    { icon:"brain", accent:"var(--orange-600)", tint:"var(--orange-tint)", label:"AI Prediction", value: mlHits },
    { icon:"cloud", accent:"var(--blue-600)", tint:"var(--blue-tint)", label:"Xác suất mưa TB", value: rainCount? Math.round(rainSum/rainCount):"—", unit: rainCount?"%":"" },
    { icon:"drop", accent:"var(--green-600)", tint:"var(--green-tint)", label:"Mực nước TB", value: waterCount? fmtNum(waterSum/waterCount,1):"—", unit: waterCount?"lvl":"" },
  ];

  document.getElementById("kpiStrip").innerHTML = kpis.map(k => `
    <div class="kpi-card" style="--kpi-accent:${k.accent}; --kpi-tint:${k.tint}">
      <div class="kpi-icon">${ICO[k.icon]}</div>
      <div class="kpi-value">${k.value}<span class="unit">${k.unit||""}</span></div>
      <div class="kpi-label">${k.label}</div>
    </div>`).join("");

  document.getElementById("navGardenCount").textContent = ids.length;
  const alertBadge = document.getElementById("navAlertCount");
  if (crit+warn > 0){ alertBadge.style.display="inline-block"; alertBadge.textContent = crit+warn; }
  else alertBadge.style.display = "none";
}

/* ============================================================
   HISTORY TRACKING (real session data only — no fabrication)
   ============================================================ */
function pushHistory(gid, analysis){
  if (!appState.history[gid]) {
    appState.history[gid] = {};
    FIELD_KEYS.forEach(k => appState.history[gid][k] = []);
  }
  const avg = analysis.node_averages || {};
  const t = Date.now();
  FIELD_KEYS.forEach(k=>{
    if (typeof avg[k] === "number"){
      const arr = appState.history[gid][k];
      arr.push({ t, v: avg[k] });
      if (arr.length > HISTORY_CAP) arr.shift();
    }
  });
}

/* ============================================================
   EVENT / NOTIFICATION DIFFING (derived from genuine state changes)
   ============================================================ */
function diffAndLogEvents(gid, gLabel, analysis){
  const prev = appState.prevAnalysis[gid];
  const now = Date.now();
  if (prev){
    const prevMatched = new Set((prev.matched||[]).map(m=>m.label_id+":"+m.severity));
    (analysis.matched||[]).forEach(m=>{
      const key = m.label_id+":"+m.severity;
      if (!prevMatched.has(key)){
        appState.events.unshift({ t: now, severity: m.severity||"ok", msg: `[${gLabel}] Rule Engine: ${m.label_name || m.label_id} (${m.severity})` });
      }
    });
    const prevRain = prev.weather?.rain_probability;
    const curRain = analysis.weather?.rain_probability;
    if (typeof curRain === "number" && (prevRain === undefined || Math.abs(curRain-(prevRain||0)) >= 20)){
      appState.events.unshift({ t: now, severity:"ok", msg: `[${gLabel}] Cập nhật dự báo mưa: ${curRain}%` });
    }
    const prevML = (prev.model_predictions||[]).map(p=>p.label_name).join("|");
    const curML = (analysis.model_predictions||[]).map(p=>p.label_name).join("|");
    if (prevML && curML && prevML !== curML){
      appState.events.unshift({ t: now, severity:"Warning", msg: `[${gLabel}] ML dự đoán thay đổi: ${curML}` });
    }
  } else {
    appState.events.unshift({ t: now, severity:"ok", msg: `[${gLabel}] Bắt đầu giám sát realtime.` });
  }
  appState.prevAnalysis[gid] = analysis;
  if (appState.events.length > 60) appState.events.length = 60;
}

}

/* ============================================================
   AI PROMPT GENERATION (kept content-complete, restyled)
   ============================================================ */
function generateAutoSummary(st, avg, w, analysis) {
  let text = `Cây đang ở giai đoạn sinh trưởng số ${st}. `;
  text += `Độ ẩm đất trung bình đạt ${avg.soil_humidity ?? "—"}%. `;
  if (avg.air_temperature && avg.air_temperature > 32) text += `Nhiệt độ không khí cao hơn ngưỡng tối ưu. `;
  else if (avg.air_temperature && avg.air_temperature < 20) text += `Nhiệt độ không khí khá thấp. `;
  else text += `Nhiệt độ không khí ở mức ổn định. `;
  if (w.rain_probability !== undefined && w.rain_probability !== null) text += `Dự báo có mưa với xác suất ${w.rain_probability}%. `;
  let mlWarning = false;
  if (analysis.model_predictions) {
    for(let p of analysis.model_predictions){
      if(!p.error && !p.skipped && p.label_name){ mlWarning = true; text += `Machine Learning dự đoán: ${p.label_name}. `; break; }
    }
  }
  let ruleWarning = false;
  if (analysis.matched && analysis.matched.length > 0) {
    let criticals = analysis.matched.filter(m => m.severity === 'Critical');
    if (criticals.length > 0){ text += `Rule Engine cảnh báo Critical: ${criticals[0].label_name}. `; ruleWarning = true; }
    else { text += `Rule Engine ghi nhận một số cảnh báo Warning. `; ruleWarning = true; }
  }
  if (!mlWarning && !ruleWarning) text += `Hệ thống Rule Engine đánh giá mọi chỉ số bình thường. `;
  else text += `Đề nghị hệ thống RAGX phân tích dữ liệu trên và đưa ra giải pháp canh tác cụ thể.`;
  return text;
}

function generateAIPrompt(g_id, data, analysis) {
  const w = analysis.weather || {};
  const avg = analysis.node_averages || {};
  const st = data.growth_stage || "?";
  const lat = data.coordinates?.lat ?? "—";
  const lng = data.coordinates?.lng ?? "—";
  const timeStr = new Date().toLocaleString("vi-VN");

  let p = `# 1. THÔNG TIN VƯỜN\n`;
  p += `- Tên vườn: ${g_id.toUpperCase()}\n`;
  p += `- Thời gian cập nhật: ${timeStr}\n`;
  p += `- Giai đoạn sinh trưởng: ${st}\n`;
  p += `- Tọa độ: Lat ${lat}, Lng ${lng}\n\n`;

  p += `# 2. DỮ LIỆU TRUNG BÌNH TOÀN VƯỜN\n`;
  p += `- Nhiệt độ không khí: ${avg.air_temperature ?? "—"} °C\n`;
  p += `- Độ ẩm không khí: ${avg.air_humidity ?? "—"} %\n`;
  p += `- Nhiệt độ đất: ${avg.soil_temperature ?? "—"} °C\n`;
  p += `- Độ ẩm đất: ${avg.soil_humidity ?? "—"} %\n`;
  p += `- Mực nước: ${avg.water_storage ?? "—"} level\n\n`;

  p += `# 3. THỜI TIẾT\n`;
  p += `- Lượng mưa hiện tại: ${w.rainfall_mm ?? "—"} mm\n`;
  p += `- Lượng mưa dự báo (xác suất): ${w.rain_probability ?? "—"} %\n`;
  p += `- Nhiệt độ ngoài trời: ${w.outdoor_temperature ?? "—"} °C\n`;
  p += `- Độ ẩm ngoài trời: ${w.outdoor_humidity ?? "—"} %\n\n`;

  p += `# 4. GIÁ TRỊ TỪNG NODE\n`;
  for(let i=1;i<=5;i++){
    const n = data[`node${i}`];
    if(n){
      p += `* Node ${i}\n`;
      p += `  - Air Temperature: ${n.air_temperature ?? "—"}\n`;
      p += `  - Air Humidity: ${n.air_humidity ?? "—"}\n`;
      p += `  - Soil Temperature: ${n.soil_temperature ?? "—"}\n`;
      p += `  - Soil Humidity: ${n.soil_humidity ?? "—"}\n`;
      p += `  - Water Storage: ${n.water_storage ?? n.water_torage ?? "—"}\n`;
    }
  }
  p += `\n`;

  p += `# 5. KẾT QUẢ MACHINE LEARNING\n`;
  if (analysis.model_predictions && analysis.model_predictions.length > 0) {
    analysis.model_predictions.forEach(pred=>{
      if(!pred.error && !pred.skipped){
        p += `- Label: ${pred.label_name || pred.label_id}\n`;
        p += `  Confidence: ${(pred.confidence*100).toFixed(1)}%\n`;
      }
    });
  } else p += `- Không có dự đoán\n`;
  p += `\n`;

  p += `# 6. KẾT QUẢ RULE ENGINE\n`;
  if (analysis.matched && analysis.matched.length > 0) {
    analysis.matched.forEach(lbl=>{ p += `- [${lbl.severity}] ${lbl.label_name}\n`; });
  } else p += `- Mọi chỉ số ổn định\n`;
  p += `\n`;

  p += `# 7. ĐÁNH GIÁ TỔNG HỢP\n`;
  p += `"${generateAutoSummary(st, avg, w, analysis)}"\n`;
  return p;
}

function highlightPromptLines(text){
  return text.split("\n").map(line=>{
    let safe = line.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    if (/^#\s/.test(line)) return `<div class="code-line h">${safe}</div>`;
    if (/^-\s/.test(line) || /^\*\s/.test(line) || /^\s{2}-/.test(line)){
      safe = safe.replace(/^(\s*[-*]\s*)([^:]+:)/, (m,a,b)=>`${a}<span class="k">${b}</span>`);
      return `<div class="code-line">${safe}</div>`;
    }
    return `<div class="code-line">${safe||"&nbsp;"}</div>`;
  }).join("");
}

function renderCoreSample(stage){
  const s = Math.max(1, Math.min(5, Number(stage) || 1));
  const layerH = 100/5;
  let layers = "";
  const colors = ["#B9772E","#A9702F","#6EB78B","#3D8C63","#235940"];
  for(let i=0;i<5;i++){
    const filled = i < s;
    layers += `<div class="layer" style="top:${i*layerH}%; height:${layerH}%; background:${filled? colors[i] : 'transparent'}; opacity:${filled?1:0.15}; border-top:1px solid rgba(255,255,255,.25)"></div>`;
  }
  return `<div class="core-sample"><div class="cap"></div>${layers}<div class="fill-label">GĐ ${s}/5</div></div>`;
}

function renderModels(analysis){
  if (!analysis || !analysis.model_predictions || analysis.model_predictions.length === 0){
    return `<div class="label-empty">Chưa có dự đoán từ mô hình Machine Learning.</div>`;
  }
  return analysis.model_predictions.map(p=>{
    if (p.error) return `<div class="model-card err"><span class="model-group">${p.group_file ?? p.stem}</span><div class="label-desc">Lỗi mô hình: ${p.error}</div></div>`;
    if (p.skipped) return `<div class="model-card"><span class="model-group">${p.group_file ?? p.stem}</span><div class="label-desc node-unreported">${p.reason || 'Bỏ qua'}</div></div>`;
    const conf = typeof p.confidence === "number" ? `${(p.confidence*100).toFixed(1)}%` : "—";
    const acc = typeof p.model_accuracy === "number" ? `${(p.model_accuracy*100).toFixed(1)}%` : null;
    const path = (p.decision_path || []).join(" → ");
    return `<div class="model-card">
      <div class="label-top" style="justify-content:space-between">
        <span class="model-group">${p.group_file ?? p.stem}</span>
        <span style="font-size:10px; color:var(--ink-faint); font-family:var(--font-mono)">Tin cậy: ${conf}${acc? ' · Độ chính xác mô hình: '+acc:''}</span>
      </div>
      <span class="model-label">${p.label_name || "?"} <span style="font-size:11px;color:var(--ink-faint)">[${p.label_id ?? "?"}]</span></span>
      ${p.note ? `<div class="model-note">${p.note}</div>` : ""}
      ${path ? `<div class="model-path">🌳 ${path}</div>` : ""}
    </div>`;
  }).join("");
}

function computeRisk(analysis){
  const crit = (analysis.matched||[]).filter(m=>m.severity==="Critical").length;
  const warn = (analysis.matched||[]).filter(m=>m.severity==="Warning").length;
  let risk = crit*35 + warn*15;
  risk = Math.min(100, risk);
  return risk;
}

function renderInsight(gid, data, analysis){
  const st = data.growth_stage || "?";
  const avg = analysis.node_averages || {};

  const risk = computeRisk(analysis);
  const tags = [];
  if (analysis.matched?.some(m=>m.severity==="Critical")) tags.push("Ưu tiên: kiểm tra ngay");
  if (typeof w.rain_probability === "number" && w.rain_probability > 60) tags.push("Đề xuất: hoãn tưới, có mưa");
  if (typeof avg.soil_humidity === "number" && avg.soil_humidity < 40) tags.push("Đề xuất: tăng tưới");
  if (!tags.length) tags.push("Duy trì lịch chăm sóc hiện tại");
  return `
    <div class="insight-wrap">
      <div class="risk-ring" id="risk-${gid}"></div>
      <div>
        <div class="insight-text">${summary}</div>
        <div class="insight-tags">${tags.map(t=>`<span>${t}</span>`).join("")}</div>
      </div>
    </div>`;
}

function renderHeatmap(gardenData){
  const nodes = Object.entries(gardenData).filter(([k])=>k.startsWith("node"));
  if (!nodes.length) return `<div class="label-empty">Không có dữ liệu node.</div>`;
  function colorFor(v, range){
    if (typeof v !== "number") return "#D2CDB8";
    const s = scoreInRange(v, range);
    if (s>=70) return "#3D8C63";
    if (s>=40) return "#C08A1E";
    return "#B33F3A";
  }
  let head = `<tr><th>Node</th>${FIELD_KEYS.filter(k=>k!=="water_storage").map(k=>`<th>${FIELD_META[k].label}</th>`).join("")}</tr>`;
  let rows = nodes.map(([key,val])=>{
    const cells = FIELD_KEYS.filter(k=>k!=="water_storage").map(k=>{
      const v = val[k];
      return `<td><div class="heat-cell" style="background:${colorFor(v, FIELD_META[k].range)}">${fmtNum(v)}</div></td>`;
    }).join("");
    return `<tr><td style="font-family:var(--font-mono); font-size:11px; color:var(--ink-dim)">${key}</td>${cells}</tr>`;
  }).join("");
  return `<table class="heatmap-table">${head}${rows}</table>`;
}

              <div class="garden-meta-tags">
                <span>${ICO.pin.replace('width="24" height="24"','width="11" height="11"')} Lat ${fmtNum(lat,4)}, Lng ${fmtNum(lng,4)}</span>
                <span>${ICO.node.replace('width="24" height="24"','width="11" height="11"')} ${nodeCount} node</span>
                <span>${ICO.cloud.replace('width="24" height="24"','width="11" height="11"')} Mưa ${w.rain_probability ?? '—'}%</span>
              </div>
            </div>
          </div>
          <div class="garden-map-col">${renderMiniMap(lat,lng,gid)}</div>
        </div>
        <div class="garden-health">
          <div class="health-ring" id="healthring-${gid}"></div>
          <div class="health-copy">
            <div class="label">Health Score</div>
            <div class="value">${gardenHealth}%</div>
            <div class="sub">Giai đoạn ${st}/5 · cập nhật ${timeAgo(Object.values(data).find(v=>v?.time)?.time)}</div>
          </div>
        </div>
        <div class="garden-body">
          <p class="fb-section-label" data-tag="NODES">Realtime Node Monitoring</p>
          <div id="nodes-${gid}">${renderNodes(data)}</div>

          <p class="fb-section-label" data-tag="STATS">Garden Statistics</p>
          <div id="stats-${gid}">${renderStatRow(gid, avg)}</div>

          <p class="fb-section-label" data-tag="WX">Weather Panel</p>
          <div class="panel">${renderWeather(w)}</div>

          <p class="fb-section-label" data-tag="TREND">Realtime Trend (phiên hiện tại)</p>
          <div class="panel">
            <div class="chart-tabs" id="tabs-${gid}">${renderChartTabs(gid)}</div>
            <div class="chart-note">Biểu đồ hiển thị dữ liệu thu thập trong phiên realtime đang chạy — chưa có kho lưu trữ 24h/7 ngày/30 ngày.</div>
            <div class="chart-canvas-wrap"><canvas id="chart-${gid}"></canvas></div>
          </div>

          <p class="fb-section-label" data-tag="HEAT">Heatmap so sánh Node</p>
          <div class="panel" id="heatmap-${gid}">${renderHeatmap(data)}</div>

          <div style="margin-bottom:20px;">
            <p class="fb-section-label" data-tag="RULE">Rule Engine Monitor</p>
            <div class="panel label-list">${renderLabels(analysis)}</div>
          </div>

          <p class="fb-section-label" data-tag="AI">AI Insight</p>
          <div class="panel" id="insight-${gid}">${renderInsight(gid, data, analysis)}</div>

          <p class="fb-section-label" data-tag="PROMPT">AI Prompt (RAGX Input)</p>
          <div class="code-panel">
            <div class="code-panel-bar">
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="code-dots"><span></span><span></span><span></span></div>
                <span class="code-title">ragx-input · ${gid}.md</span>
              </div>
              <div class="code-actions">
                <button class="code-btn" onclick="regeneratePrompt('${gid}')">${ICO.refresh}Generate</button>
                <button class="code-btn" onclick="copyPrompt(this,'${gid}')">${ICO.copy}Copy</button>
                <button class="code-btn" onclick="exportPrompt('${gid}')">${ICO.download}Export</button>
                <button class="code-btn primary" onclick="sendToAI('${gid}')">${ICO.send}Send to AI</button>
              </div>
            </div>
            <div class="code-body" id="codebody-${gid}"></div>
            <div class="code-history" id="codehist-${gid}"></div>
          </div>
        </div>
      </div>`;
  }
  document.getElementById("gardenContainer").innerHTML = html || `<div class="empty-state">Đang đợi dữ liệu từ Firebase...</div>`;

  // second pass: draw canvases + rings + prompt bodies (need DOM present)
  for (const [gid, gObj] of Object.entries(gardens)){
    if (!gObj.analysis || gObj.analysis.ok === false) continue;
    updateGardenDynamicParts(gid, gObj.data, gObj.analysis);
    renderPromptPanel(gid, gObj.data, gObj.analysis);
  }
  renderKPIs(gardens);
  renderTimeline();
}

function updateGardenDynamicParts(gid, data, analysis){
  const avg = analysis.node_averages || {};
  FIELD_KEYS.forEach(k=>{
    const canvas = document.getElementById(`spark-${gid}-${k}`);
    if (canvas) drawSparkline(canvas, appState.history[gid]?.[k], FIELD_META[k].color);
  });
  const metric = appState.activeChartMetric[gid] || "soil_humidity";
  const chartCanvas = document.getElementById(`chart-${gid}`);
  if (chartCanvas) drawLineChart(chartCanvas, appState.history[gid]?.[metric], FIELD_META[metric].color, FIELD_META[metric].unit);
  const tabsEl = document.getElementById(`tabs-${gid}`);
  if (tabsEl) tabsEl.innerHTML = renderChartTabs(gid);

  const healths = Object.keys(data).filter(k=>k.startsWith("node")).map(k=>nodeHealthScore(data[k])).filter(v=>v!==null);
  const gardenHealth = healths.length ? Math.round(healths.reduce((a,b)=>a+b,0)/healths.length) : 0;
  const ringEl = document.getElementById(`healthring-${gid}`);
  if (ringEl) drawRing(ringEl, gardenHealth, gardenHealth>=70? "#2E7350" : gardenHealth>=40? "#C08A1E" : "#B33F3A", "#EFEEE4");

  const riskEl = document.getElementById(`risk-${gid}`);
  if (riskEl){
    const risk = computeRisk(analysis);
    drawRing(riskEl, risk, risk>=50? "#B33F3A" : risk>=20? "#C08A1E" : "#2E7350", "#EFEEE4");
  }
}

/* ============================================================
   STATUS CHIPS
   ============================================================ */
function setConnState(connected, detail){
  appState.connected = connected;
  document.getElementById("connDot").className = "dot " + (connected ? "up pulse" : "down");
  document.getElementById("connText").textContent = connected ? "Live (Realtime Active)" : (detail || "Mất kết nối");
  document.getElementById("dotFirebase").className = "dot " + (connected ? "up pulse" : "down");
}
function setSubsystemStatus(gardens){
  const anyWeather = Object.values(gardens).some(g => g.analysis?.weather && !g.analysis.weather.error);
  const anyRule = Object.values(gardens).some(g => Array.isArray(g.analysis?.matched));
  const anyML = Object.values(gardens).some(g => (g.analysis?.model_predictions||[]).some(p=>!p.error && !p.skipped));
  document.getElementById("dotWeather").className = "dot " + (anyWeather ? "up" : "warn");
  document.getElementById("dotRule").className = "dot " + (anyRule ? "up" : "warn");
  document.getElementById("dotML").className = "dot " + (anyML ? "up" : "warn");
  document.getElementById("dotRAGX").className = "dot up";
}

   TIMELINE SECTION MOUNT (inserted once nodes area is known)

  sec.id = "secTimeline";
  sec.setAttribute("data-anchor","secTimeline");
  sec.innerHTML = `<p class="fb-section-label" data-tag="LOG">Notification Center · Timeline</p>
    <div class="panel" id="globalTimeline"></div>`;
  document.getElementById("fbMain").appendChild(sec);

ensureTimelineSection();

document.querySelectorAll('.fb-nav-item[data-target="secNodes"]').forEach(b=>b.dataset.target="secGardens");
document.querySelectorAll('.fb-nav-item[data-target="secWeather"]').forEach(b=>b.dataset.target="secGardens");
document.querySelectorAll('.fb-nav-item[data-target="secCharts"]').forEach(b=>b.dataset.target="secGardens");

/* ============================================================
   DATA WIRING (unchanged integration contract with firebase_runner.py)
   ============================================================ */
function handleUpdate(gardens){
  renderGardens(gardens);
  setSubsystemStatus(gardens);
}

function tryStartRealtimeStream(){
  const a = api();
  if (typeof a?.runPythonStream !== "function") return false;
  try {
    a.runPythonStream(
      "firebase/dashboard/firebase_runner.py",
      ["--action", "stream"],
      (line) => {
        let evt;
        try { evt = JSON.parse(line); } catch { return; }
        if (evt.type === "ready") setConnState(true);
        else if (evt.type === "update" && evt.gardens){ handleUpdate(evt.gardens); setConnState(true); }
        else if (evt.type === "stream-error") setConnState(false, evt.error);
      },
      (err) => setConnState(false, String(err))
    );
    return true;
  } catch (e){ return false; }
}

if (!api()?.runPython){
  setConnState(false, "Vui lòng mở ứng dụng qua Electron");
} else {
  const isStreaming = tryStartRealtimeStream();
  if (!isStreaming){
    setInterval(() => {
      api().runPython("firebase/dashboard/firebase_runner.py", ["--action", "get-all"])
        .then(res => {
          const out = JSON.parse(res.output.trim().split("\n").pop());
          if (out.gardens) handleUpdate(out.gardens);
        });
    }, 5000);
  }
}

window.addEventListener("resize", () => {
  Object.keys(appState.gardens).forEach(gid=>{
    const g = appState.gardens[gid];
    if (g?.analysis && g.analysis.ok !== false) updateGardenDynamicParts(gid, g.data, g.analysis);
  });
});
</script>
